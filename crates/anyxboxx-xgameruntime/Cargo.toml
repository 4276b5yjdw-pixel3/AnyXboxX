[package]
name = "anyxboxx-xgameruntime"
description = "xgameruntime.dll in Rust: the GDK runtime seen by the title (QueryApiImpl, served interfaces, registry, HDR). Port of runtime/xgameruntime (C++), same exports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# xgameruntime.dll: the title loads it by this name (file names are case-insensitive).
name = "xgameruntime"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[lints]
workspace = true
