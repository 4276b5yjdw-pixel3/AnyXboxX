<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<rect width="760" height="410" fill="#f7f8fa"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#1d2230">AnyXboxX : avancée de la traduction Xbox Series X</text>
<text x="24" y="56" fill="#4b5263">Part traduite pour la Xbox Series X · vert complet, orange partiel, rouge pas commencé</text>
<text x="270" y="90" text-anchor="end" fill="#1d2230">Instructions processeur (x86-64, Zen 2)</text>
<rect x="300" y="76" width="220" height="18" rx="3" fill="#e3e6ee"/>
<rect x="300" y="76" width="220" height="18" rx="3" fill="#107c10"/>
<text x="532" y="90" fill="#1d2230">100 %</text>
<text x="300" y="110" font-size="11" fill="#4b5263">même jeu d'instructions que le PC : exécutées telles quelles en mode natif</text>
<text x="270" y="136" text-anchor="end" fill="#1d2230">Instructions GPU (RDNA 2, shaders console)</text>
<rect x="300" y="122" width="220" height="18" rx="3" fill="#e3e6ee"/>
<rect x="300" y="122" width="0" height="18" rx="3" fill="#c42b1c"/>
<text x="532" y="136" fill="#1d2230">0 %</text>
<text x="300" y="156" font-size="11" fill="#4b5263">recompilateur RDNA 2 → DXIL pas commencé</text>
<text x="270" y="182" text-anchor="end" fill="#1d2230">Fonctions système importées par le paquet</text>
<rect x="300" y="168" width="220" height="18" rx="3" fill="#e3e6ee"/>
<rect x="300" y="168" width="144" height="18" rx="3" fill="#e8890c"/>
<text x="532" y="182" fill="#1d2230">876/1337 (66 %)</text>
<text x="300" y="202" font-size="11" fill="#4b5263">mode isolé : émulées ou fournies par une DLL du paquet</text>
<text x="270" y="228" text-anchor="end" fill="#1d2230">xmem.dll</text>
<rect x="300" y="214" width="220" height="18" rx="3" fill="#e3e6ee"/>
<rect x="300" y="214" width="165" height="18" rx="3" fill="#e8890c"/>
<text x="532" y="228" fill="#1d2230">3/4 (75 %)</text>
<text x="300" y="248" font-size="11" fill="#4b5263">XMemGetWorkingSetStatistics (partiel : structure non publique)</text>
<text x="270" y="274" text-anchor="end" fill="#1d2230">d3d12_xs.dll</text>
<rect x="300" y="260" width="220" height="18" rx="3" fill="#e3e6ee"/>
<rect x="300" y="260" width="220" height="18" rx="3" fill="#107c10"/>
<text x="532" y="274" fill="#1d2230">2/2 (100 %)</text>
<text x="300" y="294" font-size="11" fill="#4b5263">complet</text>
<text x="270" y="320" text-anchor="end" fill="#1d2230">D3D12.X : périphérique et interfaces ID3D12*</text>
<rect x="300" y="306" width="220" height="18" rx="3" fill="#e3e6ee"/>
<rect x="300" y="306" width="0" height="18" rx="3" fill="#c42b1c"/>
<text x="532" y="320" fill="#1d2230">0 %</text>
<text x="300" y="340" font-size="11" fill="#4b5263">pas commencé : tables de méthodes console différentes du PC</text>
<text x="270" y="366" text-anchor="end" fill="#1d2230">Fonctions du runtime GDK servies par AnyXboxX</text>
<rect x="300" y="352" width="220" height="18" rx="3" fill="#e3e6ee"/>
<rect x="300" y="352" width="15" height="18" rx="3" fill="#e8890c"/>
<text x="532" y="366" fill="#1d2230">27/396 (7 %)</text>
<text x="300" y="386" font-size="11" fill="#4b5263">1/34 interfaces, actives quand AnyXboxX gère seul le runtime (sinon le runtime GDK de Windows sert tout)</text>
</svg>